name: Tests

on: ['push', 'pull_request']

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      # Живые запросы исключены группой live: сайт принимает их только с российских адресов
      - name: Tests
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      # Анализ не зависит от версии PHP, поэтому запускается один раз
      - name: Static analysis
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Upload coverage to Coveralls
        if: matrix.php == '8.4'
        uses: coverallsapp/github-action@v2
        with:
          file: clover.xml
          fail-on-error: false
